server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:bank.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=never
spring.jackson.default-property-inclusion=non_null

# Seed mode used ONLY when bank.db is created for the first time:
#   admin = empty database + one admin user (default)
#   buggy = demo data containing the seeded database bugs
#   none  = completely empty (no users at all)
app.seed=admin
